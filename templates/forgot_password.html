{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-red-50 via-white to-orange-50 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-white rounded-3xl shadow-2xl shadow-red-100/50 p-8 md:p-10">
            <!-- Logo -->
            <a href="{{ url_for('index') }}" class="flex items-center gap-2 text-primary text-2xl font-bold mb-8">
                <i class="fa-solid fa-house-chimney"></i> KwachaStay
            </a>

            <h1 class="text-2xl font-bold text-gray-900 mb-2">Forgot your password?</h1>
            <p class="text-gray-500 text-sm mb-8">Enter your email address and we'll send you a link to reset your password.</p>

            <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="email" name="email" required autocomplete="email"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition"
                            placeholder="your@email.com">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary text-white py-3.5 rounded-xl font-bold hover:bg-red-600 active:scale-[0.98] transition shadow-lg shadow-red-200/60 text-base">
                    <i class="fa-solid fa-paper-plane mr-2"></i>Send Reset Link
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-6">
                Remembered it? <a href="{{ url_for('login') }}" class="text-primary font-bold hover:underline">Back to Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
