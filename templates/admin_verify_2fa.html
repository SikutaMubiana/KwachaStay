{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
        <div class="flex items-center gap-3 mb-4">
            <span class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-primary/10 text-primary">
                <i class="fa-solid fa-shield-halved text-lg"></i>
            </span>
            <div>
                <h1 class="text-xl font-bold text-gray-900">Admin Two-Factor Verification</h1>
                <p class="text-xs text-gray-500">Enter the 6-digit code from your authenticator app.</p>
            </div>
        </div>

        <form action="{{ url_for('admin_verify_2fa') }}" method="POST" class="space-y-5 mt-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="totp_code" class="block text-sm font-semibold text-gray-700 mb-1">
                    Authenticator Code
                </label>
                <input id="totp_code" name="totp_code" type="text" inputmode="numeric"
                    pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus
                    placeholder="123456"
                    class="w-full px-4 py-3 text-center text-2xl tracking-[0.4em] font-mono rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary">
            </div>
            <button type="submit"
                class="w-full py-3 rounded-xl bg-primary text-white font-bold hover:bg-primaryDark transition">
                Verify &amp; Open Admin Dashboard
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('login') }}" class="text-sm text-gray-500 hover:text-primary">
                Cancel and return to login
            </a>
        </div>
    </div>
</div>
{% endblock %}
