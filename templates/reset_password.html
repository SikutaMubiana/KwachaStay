{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gradient-to-br from-red-50 via-white to-orange-50 flex items-center justify-center px-4 py-16">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl shadow-red-100/50 p-8 md:p-10">
            <a href="{{ url_for('index') }}" class="flex items-center gap-2 text-primary text-2xl font-bold mb-8">
                <i class="fa-solid fa-house-chimney"></i> KwachaStay
            </a>

            <h1 class="text-2xl font-bold text-gray-900 mb-2">Set a new password</h1>
            <p class="text-gray-500 text-sm mb-8">Choose a strong password with at least 8 characters including letters and numbers.</p>

            <form action="{{ url_for('reset_password', token=token) }}" method="POST" class="space-y-5" id="resetForm">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" name="password" required minlength="8"
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition"
                            placeholder="New password">
                        <button type="button" onclick="togglePw('password', this)" title="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock-open text-gray-400"></i>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" required
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition"
                            placeholder="Confirm new password">
                        <button type="button" onclick="togglePw('confirm_password', this)" title="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <p id="mismatch-msg" class="text-xs text-red-500 mt-1 hidden">Passwords do not match.</p>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-primary text-white py-3.5 rounded-xl font-bold hover:bg-primaryDark active:scale-[0.98] transition shadow-lg shadow-lime-500/20/60 text-base">
                    <i class="fa-solid fa-key mr-2"></i>Reset Password
                </button>
            </form>
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce() }}">
    function togglePw(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    document.getElementById('resetForm').addEventListener('submit', function (e) {
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirm_password').value;
        const msg = document.getElementById('mismatch-msg');
        if (pw !== cpw) {
            e.preventDefault();
            msg.classList.remove('hidden');
        } else {
            msg.classList.add('hidden');
        }
    });
</script>
{% endblock %}
