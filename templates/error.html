{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-50 text-primary mb-6">
        <i class="fa-solid fa-shield-exclamation text-3xl"></i>
    </div>
    <p class="text-sm font-bold uppercase tracking-wider text-primary">Error {{ status_code }}</p>
    <h1 class="text-3xl font-bold text-gray-900 mt-2">{{ error_title }}</h1>
    <p class="text-gray-600 mt-4 leading-relaxed">{{ error_message }}</p>
    <div class="mt-8 flex items-center justify-center gap-4">
        <a href="{{ url_for('index') }}"
            class="px-5 py-2.5 rounded-xl bg-primary text-white font-semibold hover:bg-primaryDark transition">
            Go Home
        </a>
        {% if g.user %}
        <a href="{{ url_for('dashboard') }}"
            class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition">
            My Dashboard
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
